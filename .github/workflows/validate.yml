name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Filter *.ps1 -Recurse | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error "Syntax errors in $($_.FullName): $($errors -join '; ')"
            }
          }
          if ($failed) { exit 1 }

      - name: Validate JSON configuration
        shell: pwsh
        run: |
          Get-ChildItem -Path config -Filter *.json -Recurse | ForEach-Object {
            Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
            Write-Host "Validated $($_.FullName)"
          }

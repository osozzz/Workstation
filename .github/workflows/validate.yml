name: Validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up contract validation Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/contract/requirements.txt

      - name: Install contract validation dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r ./tests/contract/requirements.txt

      - name: Validate contract schemas and fixtures
        shell: pwsh
        run: |
          python ./tests/contract/validate_contract_fixtures.py

      - name: Validate normalized comparison report outputs
        shell: pwsh
        run: |
          ./tests/comparison-output/validate_comparison_output.ps1

      - name: Validate platform provider fixtures
        shell: pwsh
        run: |
          python ./tests/platform/validate_platform_fixtures.py

      - name: Validate JavaScript toolchain fixtures
        shell: pwsh
        run: |
          python ./tests/javascript/validate_javascript_fixtures.py

      - name: Validate Java JVM fixtures
        shell: pwsh
        run: |
          python ./tests/java/validate_java_fixtures.py

      - name: Validate Flutter Dart Android fixtures
        shell: pwsh
        run: |
          python ./tests/mobile/validate_mobile_fixtures.py

      - name: Validate Python ecosystem fixtures
        shell: pwsh
        run: |
          python ./tests/python/validate_python_fixtures.py

      - name: Validate .NET toolchain fixtures
        shell: pwsh
        run: |
          python ./tests/dotnet/validate_dotnet_fixtures.py

      - name: Validate Rust Go toolchain fixtures
        shell: pwsh
        run: |
          python ./tests/rust-go/validate_rust_go_fixtures.py

      - name: Validate developer CLI fixtures
        shell: pwsh
        run: |
          python ./tests/developer-clis/validate_developer_cli_fixtures.py

      - name: Validate Sprint 2 integration fixtures
        shell: pwsh
        run: |
          python ./tests/integration/validate_sprint2_suite.py

      - name: Validate PATH scope model
        shell: pwsh
        run: |
          ./tests/path/validate_path_model.ps1

      - name: Validate safe environment intelligence
        shell: pwsh
        run: |
          ./tests/environment/validate_environment_model.ps1

      - name: Validate command PATH precedence
        shell: pwsh
        run: |
          ./tests/path-precedence/validate_command_path_precedence.ps1

      - name: Validate JavaScript precedence intelligence
        shell: pwsh
        run: |
          ./tests/javascript-precedence/validate_javascript_precedence.ps1

      - name: Validate JVM and mobile precedence intelligence
        shell: pwsh
        run: |
          ./tests/jvm-mobile-precedence/validate_jvm_mobile_precedence.ps1

      - name: Validate Python .NET Rust and Go precedence intelligence
        shell: pwsh
        run: |
          ./tests/runtime-precedence/validate_runtime_precedence.ps1

      - name: Validate Sprint 3 PATH environment integration gate
        shell: pwsh
        run: |
          python ./tests/sprint3-integration/validate_sprint3_suite.py

      - name: Validate bounded local project discovery
        shell: pwsh
        run: |
          ./tests/projects-local/validate_projects_local.ps1

      - name: Validate JavaScript and web project detection
        shell: pwsh
        run: |
          ./tests/projects-javascript/validate_javascript_projects.ps1

      - name: Validate non-JavaScript project detection
        shell: pwsh
        run: |
          ./tests/projects-non-javascript/validate_non_javascript_projects.ps1

      - name: Validate Git repository state and upstream health
        shell: pwsh
        run: |
          ./tests/git-repository-health/validate_git_repository_health.ps1

      - name: Validate Git branch and worktree hygiene
        shell: pwsh
        run: |
          ./tests/git-branch-worktree-hygiene/validate_git_branch_worktree_hygiene.ps1

      - name: Validate Sprint 4 Project and Git Discovery integration gate
        shell: pwsh
        run: |
          python ./tests/sprint4-integration/validate_sprint4_suite.py

      - name: Validate shared version intelligence source runtime
        shell: pwsh
        run: |
          ./tests/version-intelligence-runtime/validate_version_intelligence_runtime.ps1

      - name: Validate Node npm and pnpm version intelligence
        shell: pwsh
        run: |
          ./tests/javascript-version-intelligence/validate_javascript_version_intelligence.ps1

      - name: Validate Angular TypeScript and Prisma version intelligence
        shell: pwsh
        run: |
          ./tests/javascript-ecosystem-version-intelligence/validate_javascript_ecosystem_version_intelligence.ps1

      - name: Validate Flutter and Java version intelligence
        shell: pwsh
        run: |
          ./tests/jvm-mobile-version-intelligence/validate_jvm_mobile_version_intelligence.ps1

      - name: Validate WinGet upgrade intelligence
        shell: pwsh
        run: |
          ./tests/winget-upgrade-intelligence/validate_winget_upgrade_intelligence.ps1

      - name: Validate Sprint 5 Version Intelligence integration gate
        shell: pwsh
        run: |
          ./tests/sprint5-integration/validate_sprint5_version_intelligence.ps1

      - name: Validate normalized comparison contract
        shell: pwsh
        run: |
          ./tests/comparison-core/validate_comparison_core.ps1
          python ./tests/comparison-core/validate_comparison_schema.py

      - name: Validate component and version comparison
        shell: pwsh
        run: |
          ./tests/component-version-comparison/validate_component_version_comparison.ps1

      - name: Validate PATH and environment comparison
        shell: pwsh
        run: |
          ./tests/path-environment-comparison/validate_path_environment_comparison.ps1

      - name: Validate WinGet and application comparison
        shell: pwsh
        run: |
          ./tests/winget-application-comparison/validate_winget_application_comparison.ps1

      - name: Validate project and runtime-constraint comparison
        shell: pwsh
        run: |
          ./tests/project-runtime-comparison/validate_project_runtime_comparison.ps1

      - name: Validate Git health comparison
        shell: pwsh
        run: |
          ./tests/git-health-comparison/validate_git_health_comparison.ps1

      - name: Validate Sprint 6 Cross-PC Comparison integration gate
        shell: pwsh
        run: |
          ./tests/sprint6-integration/validate_sprint6_cross_pc_comparison.ps1

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Path scripts -Recurse -File |
            Where-Object { $_.Extension -in @('.ps1', '.psm1') } |
            ForEach-Object {
              $tokens = $null
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $failed = $true
                Write-Error "Syntax errors in $($_.FullName): $($errors -join '; ')"
              }
            }
          if ($failed) { exit 1 }

      - name: Smoke-test audit core runtime
        shell: pwsh
        run: |
          Import-Module ./scripts/Core/Audit.Core.psm1 -Force

          $success = Invoke-AuditCommand -Command 'cmd.exe' -Arguments @('/d', '/c', 'exit 0')
          if ($success.Status -ne 'success' -or $success.ExitCode -ne 0) {
            throw "Expected successful command execution."
          }

          $missing = Invoke-AuditCommand -Command '__workstation_missing_command__'
          if ($missing.Status -ne 'not-found' -or $missing.Found) {
            throw "Expected missing command to return not-found."
          }

          $nonZero = Invoke-AuditCommand -Command 'cmd.exe' -Arguments @('/d', '/c', 'exit 7')
          if ($nonZero.Status -ne 'non-zero' -or $nonZero.ExitCode -ne 7) {
            throw "Expected non-zero command execution to preserve exit code."
          }

          $failed = Invoke-AuditCommand -Command 'Get-Date' -Arguments @('-DefinitelyNotAParameter')
          if ($failed.Status -ne 'failed') {
            throw "Expected invocation failure to return failed."
          }

          $timedOut = Invoke-AuditCommand -Command 'cmd.exe' -Arguments @('/d', '/c', 'ping 127.0.0.1 -n 5 >nul') -TimeoutSeconds 1
          if ($timedOut.Status -ne 'timed-out' -or -not $timedOut.TimedOut) {
            throw "Expected timed command to return timed-out."
          }

          $evidence = New-AuditEvidence -EvidenceId 'synthetic.secret' -Type command -Source 'synthetic command' -Captured 'sensitive-value' -Sensitive
          if (-not $evidence.Redacted -or $null -ne $evidence.Captured) {
            throw "Expected sensitive evidence to be redacted."
          }

          $warning = New-AuditIssue -Code 'SYNTHETIC_WARNING' -Message 'Synthetic warning.' -Severity warning
          $providerStatus = Get-AuditProviderStatus -Warnings @($warning)
          if ($providerStatus -ne 'warning') {
            throw "Expected provider status warning."
          }

          $allowedEnvironment = Get-AuditEnvironmentSnapshot -Names @('JAVA_HOME', 'PNPM_HOME')
          if (@($allowedEnvironment).Count -ne 2) {
            throw "Expected allowlisted environment snapshot entries."
          }

          $rejectedEnvironmentName = $false
          try {
            Get-AuditEnvironmentSnapshot -Names @('PATH') | Out-Null
          }
          catch {
            $rejectedEnvironmentName = $true
          }

          if (-not $rejectedEnvironmentName) {
            throw "Expected non-allowlisted environment variable access to be rejected."
          }

          $testOverrideName = 'WORKSTATION_AUDIT_CHILD_OVERRIDE'
          $previousOverride = [Environment]::GetEnvironmentVariable($testOverrideName, 'Process')
          [Environment]::SetEnvironmentVariable($testOverrideName, 'parent-value', 'Process')
          try {
            $overridden = Invoke-AuditCommand -Command 'cmd.exe' -Arguments @('/d', '/c', 'echo %WORKSTATION_AUDIT_CHILD_OVERRIDE%') -TimeoutSeconds 10 -EnvironmentOverrides @{ WORKSTATION_AUDIT_CHILD_OVERRIDE = 'child-value' }
            if ($overridden.Status -ne 'success' -or $overridden.Captured.Trim() -ne 'child-value') {
              throw "Expected isolated child-process environment override."
            }

            $parentValue = [Environment]::GetEnvironmentVariable($testOverrideName, 'Process')
            if ($parentValue -ne 'parent-value') {
              throw "Child-process environment override must not mutate the parent process."
            }
          }
          finally {
            [Environment]::SetEnvironmentVariable($testOverrideName, $previousOverride, 'Process')
          }

      - name: Smoke-test provider orchestrator
        shell: pwsh
        run: |
          $tempRoot = Join-Path $env:RUNNER_TEMP 'workstation-orchestrator'
          $reportRoot = Join-Path $tempRoot 'reports'
          $failingProvider = Join-Path $tempRoot 'SyntheticFailure.Provider.ps1'
          New-Item -ItemType Directory -Path $tempRoot -Force | Out-Null

          @'
          [CmdletBinding(DefaultParameterSetName = 'Run')]
          param(
              [Parameter(Mandatory, ParameterSetName = 'Describe')]
              [switch]$Describe,

              [Parameter(Mandatory, ParameterSetName = 'Run')]
              [psobject]$Context
          )

          if ($Describe) {
              return [pscustomobject][ordered]@{
                  providerId = 'synthetic.failure'
                  category   = 'synthetic'
                  order      = 999
              }
          }

          throw 'Synthetic provider failure.'
          '@ | Set-Content -LiteralPath $failingProvider -Encoding UTF8

          $auditArgs = @{
              OutputDirectory = $reportRoot
              AdditionalProviderPath = @($failingProvider)
              PassThru = $true
          }
          $result = & ./scripts/Audit-Workstation.ps1 -OfflineVersionIntelligence @auditArgs

          if ($result.Report.schemaVersion -ne '1.0.0') {
              throw "Expected normalized audit schema 1.0.0."
          }

          if ($result.Report.summary.providerCount -ne 21) {
              throw "Expected twenty built-in providers plus the synthetic failure provider."
          }

          foreach ($providerId in @('host.system', 'javascript.toolchain', 'java.jvm', 'mobile.flutter-android', 'python.ecosystem', 'dotnet.toolchain', 'rust-go.toolchains', 'developer.clis', 'inventory.commands', 'path.precedence', 'javascript.precedence', 'jvm-mobile.precedence', 'python-dotnet-rust-go.precedence', 'environment.baseline', 'winget.baseline', 'projects.local', 'projects.javascript-web', 'projects.non-javascript', 'git.repository-health', 'git.branch-worktree-hygiene', 'synthetic.failure')) {
              if (-not ($result.Report.providers | Where-Object providerId -eq $providerId)) {
                  throw "Expected provider '$providerId' in the aggregate report."
              }
          }

          $hostProvider = $result.Report.providers | Where-Object providerId -eq 'host.system'
          if ($hostProvider.status -eq 'failed') {
              $hostMessages = @($hostProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw "Host provider failed during smoke test: $hostMessages"
          }
          foreach ($componentId in @('windows', 'powershell.windows', 'powershell.core')) {
              if (-not ($hostProvider.components | Where-Object componentId -eq $componentId)) {
                  throw "Expected host component '$componentId'."
              }
          }

          $windowsComponent = $hostProvider.components | Where-Object componentId -eq 'windows'
          $windowsCimEvidence = $hostProvider.evidence | Where-Object evidenceId -eq 'host.windows.cim'
          if ($windowsCimEvidence -and $windowsCimEvidence.attributes.caption -and $windowsComponent.name -ne $windowsCimEvidence.attributes.caption) {
              throw "Expected the normalized Windows component name to preserve the CIM caption."
          }

          $javascriptProvider = $result.Report.providers | Where-Object providerId -eq 'javascript.toolchain'
          if ($javascriptProvider.status -eq 'failed') {
              $javascriptMessages = @($javascriptProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw "JavaScript provider failed during smoke test: $javascriptMessages"
          }

          foreach ($componentId in @('node', 'npm', 'pnpm', 'corepack', 'nvm-windows')) {
              if (-not ($javascriptProvider.components | Where-Object componentId -eq $componentId)) {
                  throw "Expected JavaScript component '$componentId'."
              }
          }

          $nodeComponent = $javascriptProvider.components | Where-Object componentId -eq 'node'
          if ($nodeComponent.state -eq 'present' -and @($nodeComponent.commandResolutions).Count -lt 1) {
              throw "Present Node.js state must preserve command resolution."
          }

          foreach ($managerId in @('npm', 'pnpm')) {
              $managerComponent = $javascriptProvider.components | Where-Object componentId -eq $managerId
              if ($managerComponent.state -in @('present', 'partial')) {
                  $inventoryEvidenceId = "javascript.$managerId.global-inventory"
                  $inventoryEvidence = $javascriptProvider.evidence | Where-Object evidenceId -eq $inventoryEvidenceId

                  if (-not $inventoryEvidence) {
                      throw "Expected redacted global inventory evidence for '$managerId'."
                  }

                  if ($null -ne $inventoryEvidence.captured -or -not $inventoryEvidence.redacted) {
                      throw "Global package inventory for '$managerId' must remain redacted."
                  }

                  $rootEvidence = $javascriptProvider.evidence | Where-Object evidenceId -eq "javascript.$managerId.global-root"
                  if ($rootEvidence -and ($null -ne $rootEvidence.captured -or -not $rootEvidence.redacted)) {
                      throw "Global package root evidence for '$managerId' must remain redacted."
                  }
              }
          }

          $javaProvider = $result.Report.providers | Where-Object providerId -eq 'java.jvm'
          if ($javaProvider.status -eq 'failed') {
              $javaMessages = @($javaProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw "Java JVM provider failed during smoke test: $javaMessages"
          }

          foreach ($componentId in @('java', 'javac', 'maven', 'gradle')) {
              if (-not ($javaProvider.components | Where-Object componentId -eq $componentId)) {
                  throw "Expected Java JVM component '$componentId'."
              }
          }

          $javaComponent = $javaProvider.components | Where-Object componentId -eq 'java'
          if ($javaComponent.state -eq 'present' -and @($javaComponent.commandResolutions).Count -lt 1) {
              throw "Present Java runtime state must preserve command resolution."
          }

          $javaInstallationEvidence = $javaProvider.evidence | Where-Object evidenceId -eq 'java.installations'
          if ($javaInstallationEvidence) {
              foreach ($installation in @($javaInstallationEvidence.attributes.installations)) {
                  if (-not $installation.path) {
                      throw "Normalized Java installation metadata must preserve its installation path."
                  }
                  if ($installation.version -and $null -eq $installation.majorVersion) {
                      throw "Normalized Java installation metadata must preserve majorVersion when version is known."
                  }
              }
          }

          $mobileProvider = $result.Report.providers | Where-Object providerId -eq 'mobile.flutter-android'
          if ($mobileProvider.status -eq 'failed') {
              $mobileMessages = @($mobileProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw "Mobile toolchain provider failed during smoke test: $mobileMessages"
          }

          foreach ($componentId in @('flutter', 'dart', 'android-sdk', 'adb', 'sdkmanager')) {
              if (-not ($mobileProvider.components | Where-Object componentId -eq $componentId)) {
                  throw "Expected mobile toolchain component '$componentId'."
              }
          }

          $flutterComponent = $mobileProvider.components | Where-Object componentId -eq 'flutter'
          if ($flutterComponent.state -eq 'present' -and @($flutterComponent.commandResolutions).Count -lt 1) {
              throw "Present Flutter state must preserve command resolution."
          }

          $dartRelationshipEvidence = $mobileProvider.evidence | Where-Object evidenceId -eq 'mobile.dart.relationship'
          if (-not $dartRelationshipEvidence) {
              throw "Expected Dart relationship evidence in mobile provider."
          }

          $androidMetadataEvidence = $mobileProvider.evidence | Where-Object evidenceId -eq 'mobile.android-sdk.metadata'
          if (-not $androidMetadataEvidence) {
              throw "Expected bounded Android SDK metadata evidence."
          }

          $pythonProvider = $result.Report.providers | Where-Object providerId -eq 'python.ecosystem'
          if ($pythonProvider.status -eq 'failed') {
              $pythonMessages = @($pythonProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw "Python ecosystem provider failed during smoke test: $pythonMessages"
          }

          foreach ($componentId in @('python', 'python-launcher', 'pip', 'pipx', 'uv', 'pyenv-win')) {
              if (-not ($pythonProvider.components | Where-Object componentId -eq $componentId)) {
                  throw "Expected Python ecosystem component '$componentId'."
              }
          }

          $pythonComponent = $pythonProvider.components | Where-Object componentId -eq 'python'
          if ($pythonComponent.state -eq 'present' -and @($pythonComponent.commandResolutions).Count -lt 1) {
              throw "Present Python state must preserve command resolution."
          }

          $pythonInstallationsEvidence = $pythonProvider.evidence | Where-Object evidenceId -eq 'python.installations'
          if (-not $pythonInstallationsEvidence) {
              throw "Expected normalized Python installation evidence."
          }

          $unsafePythonEvidence = $pythonProvider.evidence | Where-Object evidenceId -eq 'python.command-resolution'
          if (-not $unsafePythonEvidence) {
              throw "Expected Python command-resolution safety evidence."
          }

          $dotnetProvider = $result.Report.providers | Where-Object providerId -eq 'dotnet.toolchain'
          if ($dotnetProvider.status -eq 'failed') {
              $dotnetMessages = @($dotnetProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw ".NET toolchain provider failed during smoke test: $dotnetMessages"
          }

          foreach ($componentId in @('dotnet-sdk', 'dotnet-runtime', 'dotnet-workloads')) {
              if (-not ($dotnetProvider.components | Where-Object componentId -eq $componentId)) {
                  throw "Expected .NET toolchain component '$componentId'."
              }
          }

          $dotnetSdkComponent = $dotnetProvider.components | Where-Object componentId -eq 'dotnet-sdk'
          if ($dotnetSdkComponent.state -eq 'present' -and @($dotnetSdkComponent.commandResolutions).Count -lt 1) {
              throw "Present .NET SDK state must preserve dotnet command resolution."
          }

          $dotnetSdkEvidence = $dotnetProvider.evidence | Where-Object evidenceId -eq 'dotnet.sdks'
          if ($dotnetSdkEvidence) {
              foreach ($sdk in @($dotnetSdkEvidence.attributes.sdks)) {
                  if (-not $sdk.version -or -not $sdk.path) {
                      throw "Normalized .NET SDK evidence must preserve version and installation path."
                  }
              }
          }

          $dotnetRuntimeEvidence = $dotnetProvider.evidence | Where-Object evidenceId -eq 'dotnet.runtimes'
          if ($dotnetRuntimeEvidence) {
              foreach ($runtime in @($dotnetRuntimeEvidence.attributes.runtimes)) {
                  if (-not $runtime.product -or -not $runtime.version -or -not $runtime.path) {
                      throw "Normalized .NET runtime evidence must preserve product, version, and path."
                  }
              }
          }

          $dotnetWorkloadEvidence = $dotnetProvider.evidence | Where-Object evidenceId -eq 'dotnet.workloads'
          if (-not $dotnetWorkloadEvidence) {
              throw "Expected .NET workload evidence."
          }
          if (-not $dotnetWorkloadEvidence.attributes.updateMetadataIgnored) {
              throw ".NET workload update metadata must remain outside Sprint 2 normalization."
          }

          $rustGoProvider = $result.Report.providers | Where-Object providerId -eq 'rust-go.toolchains'
          if ($rustGoProvider.status -eq 'failed') {
              $rustGoMessages = @($rustGoProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw "Rust/Go toolchain provider failed during smoke test: $rustGoMessages"
          }

          foreach ($componentId in @('rustup', 'rust-toolchains', 'rustc', 'cargo', 'go')) {
              if (-not ($rustGoProvider.components | Where-Object componentId -eq $componentId)) {
                  throw "Expected Rust/Go component '$componentId'."
              }
          }

          foreach ($componentId in @('rustup', 'rustc', 'cargo', 'go')) {
              $component = $rustGoProvider.components | Where-Object componentId -eq $componentId
              if ($component.state -eq 'present' -and @($component.commandResolutions).Count -lt 1) {
                  throw "Present Rust/Go component '$componentId' must preserve command resolution."
              }
          }

          $rustToolchainEvidence = $rustGoProvider.evidence | Where-Object evidenceId -eq 'rust.toolchains'
          if (-not $rustToolchainEvidence) {
              throw "Expected Rust toolchain inventory evidence."
          }

          $goEnvironmentEvidence = $rustGoProvider.evidence | Where-Object evidenceId -eq 'go.environment'
          if (-not $goEnvironmentEvidence) {
              throw "Expected Go environment evidence."
          }
          if ($goEnvironmentEvidence.attributes.rawOutputRetained) {
              throw "Raw go env JSON must not be retained."
          }

          if ($goEnvironmentEvidence.attributes.GOTOOLCHAIN -ne 'local') {
              throw "Go probes must force GOTOOLCHAIN=local."
          }

          $developerCliProvider = $result.Report.providers | Where-Object providerId -eq 'developer.clis'
          if ($developerCliProvider.status -eq 'failed') {
              $developerCliMessages = @($developerCliProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw "Developer CLI provider failed during smoke test: $developerCliMessages"
          }

          foreach ($componentId in @('git', 'github-cli', 'docker', 'docker-compose', 'supabase-cli', 'vercel-cli', 'heroku-cli')) {
              if (-not ($developerCliProvider.components | Where-Object componentId -eq $componentId)) {
                  throw "Expected developer CLI component '$componentId'."
              }
          }

          foreach ($componentId in @('git', 'github-cli', 'docker', 'supabase-cli', 'vercel-cli', 'heroku-cli')) {
              $component = $developerCliProvider.components | Where-Object componentId -eq $componentId
              if ($component.state -eq 'present' -and @($component.commandResolutions).Count -lt 1) {
                  throw "Present developer CLI component '$componentId' must preserve command resolution."
              }
          }

          $developerSafetyEvidence = $developerCliProvider.evidence | Where-Object evidenceId -eq 'developer.safety-boundary'
          if (-not $developerSafetyEvidence) {
              throw "Expected explicit developer CLI safety-boundary evidence."
          }

          foreach ($attributeName in @(
              'authenticationStateCollected',
              'accountStateCollected',
              'gitConfigurationCollected',
              'dockerDaemonInspected',
              'dockerContextsCollected',
              'servicesStartedOrStopped'
          )) {
              if ($developerSafetyEvidence.attributes.$attributeName -ne $false) {
                  throw "Developer CLI safety boundary must preserve $attributeName=false."
              }
          }

          $pathPrecedenceProvider = $result.Report.providers | Where-Object providerId -eq 'path.precedence'
          if ($pathPrecedenceProvider.status -eq 'failed') {
              $pathMessages = @($pathPrecedenceProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw "PATH precedence provider failed during smoke test: $pathMessages"
          }

          if (@($pathPrecedenceProvider.components).Count -ne 0) {
              throw "PATH precedence provider must remain derived and own no components."
          }

          $pathPrecedenceSummary = $pathPrecedenceProvider.evidence | Where-Object evidenceId -eq 'path-precedence.summary'
          if (-not $pathPrecedenceSummary) {
              throw "Expected PATH precedence summary evidence."
          }

          if ($pathPrecedenceSummary.attributes.readOnly -ne $true) {
              throw "PATH precedence analysis must remain explicitly read-only."
          }

          if ([int]$pathPrecedenceSummary.attributes.analyzedCommandCount -lt 1) {
              throw "Expected PATH precedence provider to analyze prior command-resolution evidence."
          }

          $mappedCommandEvidence = @(
              $pathPrecedenceProvider.evidence |
                  Where-Object {
                      $_.evidenceId -like 'path-precedence.command.*' -and
                      [int]$_.attributes.mappedResolutionCount -gt 0
                  }
          )
          if ($mappedCommandEvidence.Count -lt 1) {
              throw "Expected at least one real command resolution to map to Process PATH."
          }

          $javascriptPrecedenceProvider = $result.Report.providers | Where-Object providerId -eq 'javascript.precedence'
          if ($javascriptPrecedenceProvider.status -eq 'failed') {
              $javascriptPrecedenceMessages = @($javascriptPrecedenceProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw "JavaScript precedence provider failed during smoke test: $javascriptPrecedenceMessages"
          }

          if (@($javascriptPrecedenceProvider.components).Count -ne 0) {
              throw "JavaScript precedence provider must remain derived and own no components."
          }

          $javascriptPrecedenceSummary = $javascriptPrecedenceProvider.evidence | Where-Object evidenceId -eq 'javascript-precedence.summary'
          if (-not $javascriptPrecedenceSummary) {
              throw "Expected JavaScript precedence summary evidence."
          }

          if ($javascriptPrecedenceSummary.attributes.readOnly -ne $true) {
              throw "JavaScript precedence analysis must remain explicitly read-only."
          }

          if ($javascriptPrecedenceSummary.attributes.duplicatedRuntimeDiscovery -ne $false) {
              throw "JavaScript precedence analysis must not duplicate runtime discovery."
          }

          foreach ($dependencyName in @('javascriptToolchain', 'pathPrecedence', 'environmentBaseline')) {
              if ($javascriptPrecedenceSummary.attributes.dependencies.$dependencyName -ne $true) {
                  throw "JavaScript precedence dependency '$dependencyName' was not available during smoke test."
              }
          }

          $jvmMobilePrecedenceProvider = $result.Report.providers | Where-Object providerId -eq 'jvm-mobile.precedence'
          if ($jvmMobilePrecedenceProvider.status -eq 'failed') {
              $jvmMobileMessages = @($jvmMobilePrecedenceProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw "JVM/mobile precedence provider failed during smoke test: $jvmMobileMessages"
          }

          if (@($jvmMobilePrecedenceProvider.components).Count -ne 0) {
              throw "JVM/mobile precedence provider must remain derived and own no components."
          }

          $jvmMobileSummary = $jvmMobilePrecedenceProvider.evidence | Where-Object evidenceId -eq 'jvm-mobile-precedence.summary'
          if (-not $jvmMobileSummary) {
              throw "Expected JVM/mobile precedence summary evidence."
          }

          foreach ($attributeName in @('readOnly')) {
              if ($jvmMobileSummary.attributes.$attributeName -ne $true) {
                  throw "JVM/mobile precedence analysis must preserve $attributeName=true."
              }
          }

          foreach ($attributeName in @('duplicatedRuntimeDiscovery', 'directEnvironmentAccess', 'filesystemProbes')) {
              if ($jvmMobileSummary.attributes.$attributeName -ne $false) {
                  throw "JVM/mobile precedence analysis must preserve $attributeName=false."
              }
          }

          foreach ($dependencyName in @('javaJvm', 'mobileFlutterAndroid', 'pathPrecedence', 'environmentBaseline')) {
              if ($jvmMobileSummary.attributes.dependencies.$dependencyName -ne $true) {
                  throw "JVM/mobile precedence dependency '$dependencyName' was not available during smoke test."
              }
          }

          $runtimePrecedenceProvider = $result.Report.providers | Where-Object providerId -eq 'python-dotnet-rust-go.precedence'
          if ($runtimePrecedenceProvider.status -eq 'failed') {
              $runtimePrecedenceMessages = @($runtimePrecedenceProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw "Python/.NET/Rust/Go precedence provider failed during smoke test: $runtimePrecedenceMessages"
          }

          if (@($runtimePrecedenceProvider.components).Count -ne 0) {
              throw "Python/.NET/Rust/Go precedence provider must remain derived and own no components."
          }

          $runtimePrecedenceSummary = $runtimePrecedenceProvider.evidence | Where-Object evidenceId -eq 'python-dotnet-rust-go-precedence.summary'
          if (-not $runtimePrecedenceSummary) {
              throw "Expected Python/.NET/Rust/Go precedence summary evidence."
          }

          if ($runtimePrecedenceSummary.attributes.readOnly -ne $true) {
              throw "Python/.NET/Rust/Go precedence analysis must remain explicitly read-only."
          }

          foreach ($attributeName in @(
              'duplicatedRuntimeDiscovery',
              'directEnvironmentAccess',
              'filesystemProbes',
              'dotnetArchitectureAssumed',
              'goToolchainAutoDownloadAllowed'
          )) {
              if ($runtimePrecedenceSummary.attributes.$attributeName -ne $false) {
                  throw "Python/.NET/Rust/Go precedence analysis must preserve $attributeName=false."
              }
          }

          foreach ($dependencyName in @('pythonEcosystem', 'dotnetToolchain', 'rustGoToolchains', 'pathPrecedence', 'environmentBaseline')) {
              if ($runtimePrecedenceSummary.attributes.dependencies.$dependencyName -ne $true) {
                  throw "Python/.NET/Rust/Go precedence dependency '$dependencyName' was not available during smoke test."
              }
          }

          $runtimeGoEvidence = $runtimePrecedenceProvider.evidence | Where-Object evidenceId -eq 'python-dotnet-rust-go-precedence.go'
          if ($runtimeGoEvidence -and $runtimeGoEvidence.attributes.GOTOOLCHAIN -and $runtimeGoEvidence.attributes.GOTOOLCHAIN -ne 'local') {
              throw "Python/.NET/Rust/Go precedence must preserve GOTOOLCHAIN=local evidence when Go environment data is available."
          }
          if ($runtimeGoEvidence -and $runtimeGoEvidence.attributes.autoDownloadAllowed -ne $false) {
              throw "Python/.NET/Rust/Go precedence must never allow Go toolchain auto-download."
          }

          $wingetProvider = $result.Report.providers | Where-Object providerId -eq 'winget.baseline'
          if ($wingetProvider.status -eq 'failed') {
              $wingetMessages = @($wingetProvider.errors | ForEach-Object { $_.message }) -join ' | '
              throw "WinGet provider failed during smoke test: $wingetMessages"
          }

          $wingetComponent = $wingetProvider.components | Where-Object componentId -eq 'winget'
          if (-not $wingetComponent) {
              throw "Expected normalized WinGet component."
          }

          foreach ($commandEvidence in @($wingetProvider.evidence | Where-Object type -eq 'command')) {
              $source = [string]$commandEvidence.source
              if ($source -match '(?i)winget\s+upgrade' -and $source -ne 'winget upgrade --disable-interactivity') {
                  throw "WinGet upgrade intelligence must remain a read-only non-interactive lookup."
              }
              if ($source -match '(?i)--accept-(source|package)-agreements') {
                  throw "WinGet platform detection must not accept package or source agreements."
              }
          }

          if ($wingetComponent.installed -eq $true) {
              $wingetUpgradeEvidence = $wingetProvider.evidence | Where-Object evidenceId -eq 'winget.upgrades.normalized'
              if (-not $wingetUpgradeEvidence) {
                  throw "Expected normalized WinGet upgrade intelligence when WinGet is installed."
              }
              if ($wingetUpgradeEvidence.attributes.reviewOnly -ne $true) {
                  throw "WinGet upgrade intelligence must remain explicitly review-only."
              }
          }

          $wingetSourceEvidence = $wingetProvider.evidence | Where-Object evidenceId -eq 'winget.sources'
          if ($wingetSourceEvidence -and ($null -ne $wingetSourceEvidence.captured -or -not $wingetSourceEvidence.redacted)) {
              throw "WinGet source diagnostics must redact raw source details."
          }

          $commandInventory = $result.Report.providers | Where-Object providerId -eq 'inventory.commands'
          if ($commandInventory.components | Where-Object componentId -eq 'winget') {
              throw "Generic command inventory must not duplicate WinGet ownership."
          }

          $javascriptOwnedIds = @(
              'node',
              'npm',
              'pnpm',
              'corepack',
              'nvm-windows',
              'angular-cli',
              'typescript',
              'prisma',
              'nodemon',
              'rimraf',
              'zoho-extension-toolkit',
              'zoho-catalyst-cli',
              'redis-commander'
          )

          foreach ($componentId in $javascriptOwnedIds) {
              if ($commandInventory.components | Where-Object componentId -eq $componentId) {
                  throw "Generic command inventory must not duplicate JavaScript ownership for '$componentId'."
              }
          }

          $javaOwnedIds = @('java', 'javac', 'maven', 'gradle')
          foreach ($componentId in $javaOwnedIds) {
              if ($commandInventory.components | Where-Object componentId -eq $componentId) {
                  throw "Generic command inventory must not duplicate Java JVM ownership for '$componentId'."
              }
          }

          $mobileOwnedIds = @('flutter', 'dart', 'adb')
          foreach ($componentId in $mobileOwnedIds) {
              if ($commandInventory.components | Where-Object componentId -eq $componentId) {
                  throw "Generic command inventory must not duplicate mobile toolchain ownership for '$componentId'."
              }
          }

          $pythonOwnedIds = @('python', 'python-launcher', 'pip', 'pipx', 'uv')
          foreach ($componentId in $pythonOwnedIds) {
              if ($commandInventory.components | Where-Object componentId -eq $componentId) {
                  throw "Generic command inventory must not duplicate Python ecosystem ownership for '$componentId'."
              }
          }

          if ($commandInventory.components | Where-Object componentId -eq 'dotnet-sdk') {
              throw "Generic command inventory must not duplicate .NET SDK ownership."
          }

          foreach ($componentId in @('rust', 'cargo', 'rustup', 'go')) {
              if ($commandInventory.components | Where-Object componentId -eq $componentId) {
                  throw "Generic command inventory must not duplicate Rust/Go ownership for '$componentId'."
              }
          }

          foreach ($componentId in @('git', 'github-cli', 'docker', 'docker-compose', 'supabase-cli', 'vercel-cli', 'heroku-cli')) {
              if ($commandInventory.components | Where-Object componentId -eq $componentId) {
                  throw "Generic command inventory must not duplicate developer CLI ownership for '$componentId'."
              }
          }

          if (@($commandInventory.components).Count -ne 0) {
              throw "Transitional command inventory should be empty after all Sprint 2 ownership migrations."
          }

          $failedProvider = $result.Report.providers | Where-Object providerId -eq 'synthetic.failure'
          if ($failedProvider.status -ne 'failed') {
              throw "Expected the synthetic provider to be isolated as failed."
          }

          if ($result.Report.summary.status -ne 'failed') {
              throw "Expected aggregate status to reflect the isolated provider failure."
          }

          if (-not (Test-Path -LiteralPath $result.JsonPath) -or -not (Test-Path -LiteralPath $result.MarkdownPath)) {
              throw "Expected JSON and Markdown reports to be generated despite provider failure."
          }

          $missingProviderResult = & ./scripts/Audit-Workstation.ps1 -OfflineVersionIntelligence -OutputDirectory (Join-Path $tempRoot 'missing-provider-reports') -AdditionalProviderPath @((Join-Path $tempRoot 'DoesNotExist.Provider.ps1')) -PassThru
          if (-not ($missingProviderResult.Report.errors | Where-Object code -eq 'PROVIDER_PATH_NOT_FOUND')) {
              throw "Expected missing additional provider paths to be isolated as report-level errors."
          }
          if ($missingProviderResult.Report.summary.providerCount -ne 20) {
              throw "Expected all 20 built-in providers to continue after an additional provider path failure."
          }

      - name: Run controlled Sprint 4 integration audit
        shell: pwsh
        run: |
          $integrationRoot = Join-Path $env:RUNNER_TEMP 'workstation-sprint4-integration'
          $projectRoot = Join-Path $env:RUNNER_TEMP 'workstation-project-discovery-integration'
          $localConfigPath = Join-Path $env:RUNNER_TEMP 'workstation.local.integration.json'

          foreach ($path in @($integrationRoot, $projectRoot, $localConfigPath)) {
              if (Test-Path -LiteralPath $path) {
                  Remove-Item -LiteralPath $path -Recurse -Force
              }
          }

          New-Item -ItemType Directory -Path $integrationRoot -Force | Out-Null
          $syntheticRepo = Join-Path $projectRoot 'SyntheticRepo'
          New-Item -ItemType Directory -Path $syntheticRepo -Force | Out-Null
          git -C $syntheticRepo init | Out-Null
          if ($LASTEXITCODE -ne 0) {
              throw "Could not initialize controlled synthetic Git repository."
          }
          git -C $syntheticRepo config user.name 'Synthetic Workstation CI'
          git -C $syntheticRepo config user.email 'synthetic@example.invalid'
          @{
              name = 'synthetic-integration'
              engines = @{
                  node = '>=20'
              }
              packageManager = 'pnpm@10.0.0'
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $syntheticRepo 'package.json') -Encoding UTF8
          @'
          module synthetic.example/integration

          go 1.25.0
          '@ | Set-Content -LiteralPath (Join-Path $syntheticRepo 'go.mod') -Encoding UTF8
          git -C $syntheticRepo add package.json go.mod
          git -C $syntheticRepo commit -m 'synthetic integration baseline' | Out-Null
          if ($LASTEXITCODE -ne 0) {
              throw "Could not create controlled synthetic Git baseline."
          }

          @{
              schemaVersion = '1.0'
              projects = @{
                  developmentRoots = @($projectRoot)
                  maxDiscoveryDepth = 4
              }
              git = @{
                  branchStaleDays = 90
              }
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $localConfigPath -Encoding UTF8

          try {
              $result = & ./scripts/Audit-Workstation.ps1 -OfflineVersionIntelligence -OutputDirectory $integrationRoot -LocalConfigurationPath $localConfigPath -PassThru

              if (-not (Test-Path -LiteralPath $result.JsonPath)) {
                  throw "Controlled Sprint 4 audit did not generate JSON output."
              }

              if (-not (Test-Path -LiteralPath $result.MarkdownPath)) {
                  throw "Controlled Sprint 4 audit did not generate Markdown output."
              }

              $workspacePrefix = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE).TrimEnd('\') + '\'
              $jsonFullPath = [IO.Path]::GetFullPath($result.JsonPath)
              $markdownFullPath = [IO.Path]::GetFullPath($result.MarkdownPath)

              if ($jsonFullPath.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Controlled audit JSON must remain outside the repository workspace."
              }

              if ($markdownFullPath.StartsWith($workspacePrefix, [StringComparison]::OrdinalIgnoreCase)) {
                  throw "Controlled audit Markdown must remain outside the repository workspace."
              }

              python ./tests/integration/validate_sprint2_suite.py --report "$($result.JsonPath)"
              if ($LASTEXITCODE -ne 0) {
                  throw "Controlled aggregate audit validation failed."
              }

              python ./tests/sprint3-integration/validate_sprint3_suite.py --report "$($result.JsonPath)"
              if ($LASTEXITCODE -ne 0) {
                  throw "Controlled Sprint 3 PATH/environment integration validation failed."
              }

              python ./tests/sprint4-integration/validate_sprint4_suite.py --report "$($result.JsonPath)"
              if ($LASTEXITCODE -ne 0) {
                  throw "Controlled Sprint 4 Project/Git integration validation failed."
              }
          }
          finally {
              foreach ($path in @($integrationRoot, $projectRoot, $localConfigPath)) {
                  if (Test-Path -LiteralPath $path) {
                      Remove-Item -LiteralPath $path -Recurse -Force
                  }
              }
          }

          foreach ($path in @($integrationRoot, $projectRoot, $localConfigPath)) {
              if (Test-Path -LiteralPath $path) {
                  throw "Controlled integration temporary state must be deleted after validation: $path"
              }
          }

      - name: Validate JSON configuration
        shell: pwsh
        run: |
          Get-ChildItem -Path config -Filter *.json -Recurse | ForEach-Object {
            Get-Content $_.FullName -Raw | ConvertFrom-Json | Out-Null
            Write-Host "Validated $($_.FullName)"
          }

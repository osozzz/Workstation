name: Bug report
description: Report incorrect audit, detection, comparison, or repository-tooling behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible defects in repository tooling or read-only audit behavior. Do not include secrets or raw machine reports containing sensitive data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment context
      description: Include only non-sensitive details relevant to reproduction.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I verified that this issue contains no credentials, tokens, private machine reports, or other sensitive information.
          required: true

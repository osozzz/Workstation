name: Decision proposal
description: Propose a change to workstation policy, architecture, governance, or a cross-cutting contract.
title: "[Decision]: "
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem or constraint requires a decision?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed decision
      description: State the proposed direction precisely.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List meaningful alternatives and why they were not selected.
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Consequences
      description: Describe tradeoffs, migrations, compatibility effects, and long-term impact.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: What evidence is required before the decision is considered accepted?
